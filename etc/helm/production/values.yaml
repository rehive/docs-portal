# Default values for rehive-service.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
deployment:
  replicaCount: 3
  command:
  args:
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi
image:
  repository: gcr.io/rehive-services/docs-portal
  tag: latest
  pullPolicy: IfNotPresent
service:
  name: nginx
  type: NodePort
  externalPort: 80
  internalPort: 80
# Production traffic reaches docs.rehive.com through the production Gateway, on the
# hand-applied route in helm-values/gateway-production/docs-portal-external-route.yaml.
# nginx-ingress no longer serves this app.
ingress:
  enabled: false
envFromSecret:
  enabled: false
postgres:
  enabled: false
redis:
  enabled: false
rabbitmq:
  enabled: false
workers:
  enabled: false
