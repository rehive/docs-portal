# Default values for rehive-service.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
deployment:
  replicaCount: 1
  command: null
  args: null
image:
  repository: gcr.io/rehive-services/docs-portal
  tag: latest
  pullPolicy: IfNotPresent
service:
  name: nginx
  type: NodePort
  externalPort: 80
  internalPort: 80
# Staging traffic reaches this app through the staging Gateway, on the hand-applied
# route in helm-values/gateway-staging/docs-portal-staging-external-route.yaml.
# ingress-nginx2 was removed from staging3 (November 2026). Staging docs moved from
# docs.s.rehive.com to docs.staging.rehive.com (there is no Gateway certificate for
# *.s.rehive.com).
ingress:
  enabled: false
envFromSecret:
  enabled: false
postgres:
  enabled: false
redis:
  enabled: false
rabbitmq:
  enabled: false
workersEnabled: false
